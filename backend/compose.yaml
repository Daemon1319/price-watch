name: pricewatch

services:
  postgres:
    image: postgres:18.4-alpine
    container_name: pricewatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pricewatch
      POSTGRES_USER: pricewatch
      POSTGRES_PASSWORD: pricewatch
    # Host 5433 (not 5432): a local Windows PostgreSQL install commonly
    # already owns 5432, so publishing there makes Spring hit the wrong
    # server and fail with "password authentication failed".
    ports:
      - "5433:5432"
    # Postgres 18+ images expect the volume at /var/lib/postgresql (not
    # .../data). Mounting the old path makes the container crash-loop with
    # "PostgreSQL data in /var/lib/postgresql/data (unused mount/volume)".
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricewatch -d pricewatch"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.8-alpine
    container_name: pricewatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: pricewatch-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pricewatch
      RABBITMQ_DEFAULT_PASS: pricewatch
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP catcher for notification emails. Web UI: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pricewatch-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data: