spring:
  application:
    name: price-watch

  # Used only if nothing else sets an active profile (no -D flag, no
  # SPRING_PROFILES_ACTIVE env var). Using `profiles.default` rather than
  # `profiles.active` here specifically because `default` is designed to
  # be silently overridden this way — `active` set in a properties file
  # is a stickier, less obvious thing to override from the environment.
  profiles:
    default: local

  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          '[batch_size]': 25
        '[order_inserts]': true
        '[order_updates]': true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

  cache:
    type: redis
    redis:
      time-to-live: 10m

  docker:
    compose:
      enabled: true
      file: compose.yaml
      # Overridden to start-only on the local profile (see below).
      lifecycle-management: start-and-stop
      # Don't fail app startup if Docker isn't running (e.g. CI without daemon).
      skip:
        in-tests: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

app:
  cors:
    # Overridden per profile (local hard-codes :3000; prod uses CORS_ALLOWED_ORIGINS).
    # Default keeps tests / default profile booting without a null property.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # Required in prod via JWT_SECRET env var. Local default is fine only for
    # solo dev (Base64 of 32+ random bytes) — never reuse this value outside local.
    secret: ${JWT_SECRET:dGVzdC1zZWNyZXQtdGhhdC1pcy1sb25nLWVub3VnaC0zMmJ5dGVzISE=}
    access-token-ttl: 15m
  auth:
    refresh-cookie:
      name: pw_refresh
      # Only sent to auth endpoints (login/register set it; refresh/logout read it).
      path: /api/v1/auth
      max-age-days: 7
      # Cross-origin SPA → API requires None + Secure (localhost is treated as secure).
      same-site: ${REFRESH_COOKIE_SAME_SITE:None}
      secure: ${REFRESH_COOKIE_SECURE:true}
  scheduler:
    # Every 4 hours (second minute hour day month weekday).
    product-check-cron: "0 0 */4 * * *"
  outbox:
    poll-interval-ms: 5000
    batch-size: 50
  rate-limit:
    capacity: 60
    refill-per-minute: 60
    # Stricter bucket for POST /auth/login and /auth/register (credential stuffing).
    auth-capacity: 10
    auth-refill-per-minute: 10
    # Only set true behind a reverse proxy that overwrites X-Forwarded-For.
    # Blind trust lets clients spoof IPs and bypass per-IP rate limits.
    trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
  tracking:
    # Soft abuse guard: caps ACTIVE + PAUSED subscriptions per user.
    max-items-per-user: ${TRACKING_MAX_ITEMS_PER_USER:50}
  mail:
    from: ${MAIL_FROM:pricewatch@localhost}

logging:
  level:
    root: INFO
    '[com.allan.price_watch]': DEBUG

---
spring:
  config:
    activate:
      on-profile: local
  # Explicit so we never depend on Docker Compose connection-details guessing
  # (wrong password / wrong host if something else is on 5432, or if compose
  # skipped startup and left half the stack down).
  datasource:
    # 127.0.0.1 (not localhost): on Windows, localhost can resolve to ::1 and hit
    # a different listener than Docker's published 0.0.0.0:5433 mapping.
    url: jdbc:postgresql://127.0.0.1:5433/pricewatch
    username: pricewatch
    password: pricewatch
  # Local-only: V6 was edited after apply; repair realigns flyway_schema_history
  # checksums so startup does not die on validate. Never enable this in prod.
  flyway:
    repair-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: pricewatch
    password: pricewatch
  # Local SMTP → MailHog (compose). UI at http://localhost:8025
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  docker:
    compose:
      # start-only: bring the stack up if needed, but do NOT stop containers
      # when the app exits. start-and-stop was killing Redis/Postgres on
      # failed boots, then the next run said "already running, skipping"
      # while half the services were actually down / auth-mismatched.
      lifecycle-management: start-only

app:
  cors:
    allowed-origins: http://localhost:3000
  errors:
    # Include exception class/message in 500 JSON so Postman debugging is easier.
    expose-details: true

---
spring:
  config:
    activate:
      on-profile: prod

app:
  cors:
    # Set CORS_ALLOWED_ORIGINS at deploy (comma-separated if multiple).
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # No default — fail fast if JWT_SECRET is missing in real deployments.
  jwt:
    secret: ${JWT_SECRET}